# Targeted for execution with Ansible 2.9.27.
---
- name: Install packages
  apt:
    name:
      - build-essential
      - gcc-multilib
      - gcc-5
      - gdb
      - tar
      - flawfinder
      - valgrind
      - afl
    state: present
    update_cache: yes
    cache_valid_time: 86400
    install_recommends: no
  become: true

- name: Set core_pattern for AFL
  sysctl:
    name: kernel.core_pattern
    value: core
    state: present
    reload: yes
  become: true
