# Targeted for execution with Ansible 2.9.27.
---
- hosts: localhost
  tasks:
    - name: Load instance metadata variables
      include_tasks: playbook/variables.yml

    - name: Environment bootstrap
      include_tasks: playbook/bootstrap.yml

    - name: Update Cloudflare DNS A record
      include_tasks: playbook/update-cloudflare-dns-a-record.yml
