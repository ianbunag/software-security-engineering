# Targeted for execution with Ansible 2.17.14.
---
- name: Install lightweight remote GUI packages
  apt:
    name:
      - xfce4
      - xrdp
      - xorgxrdp
      - dbus-x11
      - software-properties-common
    state: present
    update_cache: yes
    cache_valid_time: 86400
  become: true

# Native deb packages avoid Snap AppArmor sandbox restrictions that prevent browsers from opening in XRDP sessions.
- name: Add Mozilla Team PPA repository
  apt_repository:
    repo: ppa:mozillateam/ppa
    state: present
  register: ppa_add_result
  until: ppa_add_result is succeeded
  retries: 5
  delay: 5
  become: true

# Priority pinning forces APT to install the native deb from the PPA rather than Ubuntu's transitional snap-wrapper package.
- name: Pin Mozilla PPA for native Firefox
  copy:
    dest: /etc/apt/preferences.d/mozilla-firefox
    content: |
      Package: *
      Pin: release o=LP-PPA-mozillateam
      Pin-Priority: 1001
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install Firefox browser
  apt:
    name: firefox
    state: present
    update_cache: yes
  become: true

# Set Firefox as the default system browser alternative for x-www-browser.
- name: Set Firefox as default system web browser
  command: update-alternatives --set x-www-browser /usr/bin/firefox
  failed_when: false
  become: true

# Ensure XFCE configuration directories exist before deploying helper and panel configs.
- name: Ensure XFCE config directories exist
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop:
    - { path: "/home/{{ ssh_username }}/.config/xfce4", owner: "{{ ssh_username }}", group: "{{ ssh_username }}" }
    - { path: "/etc/skel/.config/xfce4", owner: "root", group: "root" }
  become: true

# Configure XFCE helper settings so the default browser launcher opens Firefox.
- name: Configure XFCE preferred browser for SSH user
  copy:
    content: "WebBrowser=firefox\n"
    dest: "/home/{{ ssh_username }}/.config/xfce4/helpers.rc"
    owner: "{{ ssh_username }}"
    group: "{{ ssh_username }}"
    mode: "0644"
  become: true

- name: Configure XFCE preferred browser for skeleton
  copy:
    content: "WebBrowser=firefox\n"
    dest: /etc/skel/.config/xfce4/helpers.rc
    owner: root
    group: root
    mode: "0644"
  become: true

# Point the default bottom dock template to the official Firefox desktop launcher.
- name: Set Firefox launcher in default XFCE panel template
  replace:
    path: /etc/xdg/xfce4/panel/default.xml
    regexp: '(xfce4-web-browser\.desktop|exo-web-browser\.desktop)'
    replace: 'firefox.desktop'
  failed_when: false
  become: true

# Update existing dock browser launchers to display the official Firefox icon and launch Firefox directly.
- name: Find existing browser dock launchers for SSH user
  find:
    paths: "/home/{{ ssh_username }}/.config/xfce4/panel"
    patterns: "*.desktop"
    recurse: yes
    contains: ".*(web-browser|WebBrowser).*"
  register: existing_dock_launchers
  become: true

- name: Update existing dock browser launchers to Firefox
  copy:
    src: /usr/share/applications/firefox.desktop
    dest: "{{ item.path }}"
    owner: "{{ ssh_username }}"
    group: "{{ ssh_username }}"
    mode: "0644"
    remote_src: yes
  loop: "{{ existing_dock_launchers.files }}"
  become: true

- name: Update user xfce4-panel.xml configuration to Firefox
  replace:
    path: "/home/{{ ssh_username }}/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-panel.xml"
    regexp: '(xfce4-web-browser\.desktop|exo-web-browser\.desktop)'
    replace: 'firefox.desktop'
  failed_when: false
  become: true

# Reload the panel to immediately reflect the Firefox icon on the active dock.
- name: Reload XFCE panel for active user session
  command: xfce4-panel -r
  environment:
    DISPLAY: ":10.0"
  become: true
  become_user: "{{ ssh_username }}"
  failed_when: false

- name: Add xrdp user to ssl-cert group
  user:
    name: xrdp
    groups: ssl-cert
    append: yes
  become: true

# Defense-in-depth ensures XRDP is accessible only through the encrypted SSH tunnel, preventing internal VPC exposure.
- name: Bind XRDP listening port strictly to localhost
  lineinfile:
    path: /etc/xrdp/xrdp.ini
    regexp: "^port="
    line: "port=tcp://127.0.0.1:3389"
    state: present
  become: true

# Wrapping XFCE in a D-Bus session ensures desktop applications and web browsers have an active session bus over XRDP.
- name: Configure lean desktop session for SSH user (disable compositing)
  copy:
    content: |
      xfconf-query -c xfwm4 -p /general/use_compositing -s false 2>/dev/null || true
      exec dbus-run-session -- startxfce4
    dest: "/home/{{ ssh_username }}/.xsession"
    owner: "{{ ssh_username }}"
    group: "{{ ssh_username }}"
    mode: "0755"
  become: true

- name: Configure lean default desktop session for skeleton
  copy:
    content: |
      xfconf-query -c xfwm4 -p /general/use_compositing -s false 2>/dev/null || true
      exec dbus-run-session -- startxfce4
    dest: /etc/skel/.xsession
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Ensure polkit localauthority directory exists
  file:
    path: /etc/polkit-1/localauthority/50-local.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Configure polkit rules to prevent GUI session authentication popups
  copy:
    dest: /etc/polkit-1/localauthority/50-local.d/45-allow-colord.pkla
    content: |
      [Allow Colord all Users]
      Identity=unix-user:*
      Action=org.freedesktop.color-manager.create-device;org.freedesktop.color-manager.create-profile;org.freedesktop.color-manager.delete-device;org.freedesktop.color-manager.delete-profile;org.freedesktop.color-manager.modify-device;org.freedesktop.color-manager.modify-profile
      ResultAny=no
      ResultInactive=no
      ResultActive=yes

      # Restricting authorization strictly to active sessions prevents unauthenticated background actions.
      [Allow PackageKit all Users]
      Identity=unix-user:*
      Action=org.freedesktop.packagekit.system-sources-refresh
      ResultAny=no
      ResultInactive=no
      ResultActive=yes
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Fetch GUI password from GCP Secret Manager
  command: "gcloud secrets versions access latest --secret={{ jammy_gui_secret_name }}"
  register: gui_password_result
  changed_when: false
  no_log: true

- name: Set runtime GUI password fact
  set_fact:
    gui_password: "{{ gui_password_result.stdout | trim }}"
  no_log: true

- name: Set user password for remote GUI authentication
  command: chpasswd
  args:
    stdin: "{{ ssh_username }}:{{ gui_password }}"
  no_log: true
  become: true

# Setting a local UNIX password enables PAM authentication; SSH must explicitly forbid password auth to avoid public brute-force attacks.
- name: Enforce disabled SSH password authentication
  copy:
    dest: /etc/ssh/sshd_config.d/60-disable-password-auth.conf
    content: "PasswordAuthentication no\n"
    owner: root
    group: root
    mode: "0644"
  become: true

# Reloading sshd applies configuration immediately without dropping active SSH connections.
- name: Reload SSH service
  systemd:
    name: ssh
    state: reloaded
  become: true

- name: Enable and restart xrdp service
  systemd:
    name: xrdp
    state: restarted
    enabled: yes
  become: true
