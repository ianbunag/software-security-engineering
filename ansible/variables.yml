# Targeted for execution with Ansible 2.9.27.
---
- name: Fetch instance metadata attributes
  include_tasks: ansible/fetch-gcp-instance-attribute.yml
  loop:
    - domain
    - cloudflare_update_dns_token_secret_name
    - git_repository
    - git_email
    - git_name
    - cloudflare_zone_id
    - cloudflare_record_id
  vars:
    gcp_metadata_attribute: "{{ item }}"
    gcp_metadata_fact: "{{ item }}"

- name: Set derived facts
  set_fact:
    vm_domain: "cmpe-279.{{ domain }}"
    documents_dir: "{{ ansible_env.HOME }}/Documents"

- name: Set dependent derived facts
  set_fact:
    git_repository_dir: "{{ documents_dir }}/cmpe-279-software-security-technologies"

- name: Validate required variables
  assert:
    that:
      - domain is defined and domain | length > 0
      - cloudflare_update_dns_token_secret_name is defined and cloudflare_update_dns_token_secret_name | length > 0
      - git_repository is defined and git_repository | length > 0
      - git_email is defined and git_email | length > 0
      - git_name is defined and git_name | length > 0
      - cloudflare_zone_id is defined and cloudflare_zone_id | length > 0
      - cloudflare_record_id is defined and cloudflare_record_id | length > 0
    fail_msg: "One or more required variables could not be fetched from instance metadata."
