# Targeted for execution with Ansible 2.9.27.
---
- hosts: localhost
  tasks:
    - name: Load instance metadata variables
      include_tasks: ansible/variables.yml

    - name: Initial environment bootstrap
      include_tasks: ansible/initial-environment-bootstrap.yml

    - name: Sync git repository
      include_tasks: ansible/sync-git-repository.yml

    - name: Update Cloudflare DNS A record
      include_tasks: ansible/update-cloudflare-dns-a-record.yml
