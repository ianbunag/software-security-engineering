# Targeted for execution with Ansible 2.9.27.
---
- name: Check repository working tree status
  command: git status --porcelain
  args:
    chdir: "{{ git_repository_dir }}"
  register: git_status_check
  changed_when: false
  failed_when: false

- name: Pull latest repository changes if working tree is clean
  command: git pull
  args:
    chdir: "{{ git_repository_dir }}"
  when:
    - git_status_check.rc == 0
    - git_status_check.stdout == ""
